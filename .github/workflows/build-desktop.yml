name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write
      actions: read
    
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build app
        run: npm run dist:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "win" ]; then
            for file in *.exe; do
              [ -f "$file" ] && sha256sum "$file" > "$file.sha256"
            done
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            for file in *.dmg *.zip; do
              [ -f "$file" ] && shasum -a 256 "$file" > "$file.sha256"
            done
          else
            for file in *.AppImage *.deb *.snap; do
              [ -f "$file" ] && sha256sum "$file" > "$file.sha256"
            done
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.sha256
            dist/latest*.yml
          retention-days: 7
      
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        with:
          draft: ${{ github.event.inputs.create_release == 'true' }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.sha256
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
